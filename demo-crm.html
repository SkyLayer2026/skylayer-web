<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — SkyLayer Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080809;--bg2:#0e0e10;--card:#141418;--purple:#7c3aed;--purple-l:#be8bf5;--border:#1e1e24;--text:#f0f0f2;--text2:#9494a0;--green:#25d366;--blue:#60a5fa;--red:#ff5f57;--yellow:#f5a623;--radius:12px;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.demo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.demo-header h2{font-size:1rem;font-weight:700}
.demo-header h2 span{color:var(--purple-l)}
.demo-header a{color:var(--text2);font-size:.85rem;text-decoration:none}
.demo-header a:hover{color:var(--purple-l)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.header-info{margin-bottom:24px}
.header-info h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.header-info p{color:var(--text2);font-size:.95rem}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.kpi-card .k-label{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-card .k-value{font-size:1.4rem;font-weight:800}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--purple-l);color:var(--purple-l)}
.btn-sm{padding:6px 14px;font-size:.78rem;border-radius:6px;cursor:pointer;border:none;font-family:var(--font);font-weight:600;transition:all .3s}
.btn-sm.edit{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.btn-sm.edit:hover{background:rgba(96,165,250,.2)}
.btn-sm.danger{background:rgba(255,95,87,.12);color:var(--red);border:1px solid rgba(255,95,87,.2)}
.btn-sm.danger:hover{background:rgba(255,95,87,.2)}
.search-bar{display:flex;gap:12px;margin-bottom:20px}
.search-bar input{flex:1;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.search-bar input:focus{border-color:var(--purple)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card h3{font-size:1rem;font-weight:700;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:9px 12px;font-size:.82rem;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(124,58,237,.03)}
.tag{padding:3px 9px;border-radius:4px;font-size:.66rem;font-weight:600}
.tag-new{background:rgba(37,211,102,.1);color:var(--green)}
.tag-contact{background:rgba(96,165,250,.1);color:var(--blue)}
.tag-proposal{background:rgba(245,166,35,.1);color:var(--yellow)}
.tag-closed{background:rgba(124,58,237,.1);color:var(--purple-l)}
.stage-pipeline{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stage{flex:1;min-width:120px;padding:14px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;text-align:center}
.stage .count{font-size:1.3rem;font-weight:800;color:var(--purple-l)}
.stage .label{font-size:.72rem;color:var(--text2);margin-top:4px}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:.85rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:480px;position:relative}
.modal-box h3{font-size:1.05rem;font-weight:700;margin-bottom:18px}
.modal-box .close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text2);font-size:1.3rem;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:5px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--purple)}
.modal-overlay{transition:opacity .25s ease}
.modal-box{animation:modalIn .25s ease}@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.kpi-card{transition:transform .3s ease,box-shadow .3s ease}.kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.12)}
tr{transition:background .2s ease}
.btn-outline{transition:all .3s ease,border-color .3s ease,color .3s ease}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}#tableWrap{overflow-x:auto}#tableWrap table{min-width:600px}.toolbar{gap:8px}.btn{padding:8px 16px;font-size:.8rem}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}.container{padding:24px 16px}.modal-box{padding:20px}}
@media(prefers-reduced-motion:no-preference){.kpi-card{transition:transform .3s ease,box-shadow .3s ease}.btn-outline{transition:all .3s ease,border-color .3s ease,color .3s ease}}
</style>
</head>
<body>

<div class="demo-header">
  <h2>Sky<span>Layer</span> — CRM</h2>
  <a href="index.html">&larr; Voltar</a>
</div>

<div class="container">
  <div class="header-info">
    <span style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--purple-l)">Gestão de Clientes</span>
    <h1>CRM — Customer Relationship Management</h1>
    <p>Gestão de clientes, pipeline de vendas e histórico de interacções.</p>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="stage-pipeline" id="pipeline"></div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">+ Novo Cliente</button>
    <button class="btn btn-outline" onclick="setFilter('todos')" id="fTodos">Todos</button>
    <button class="btn btn-outline" onclick="setFilter('novo')" id="fNovo">Novos</button>
    <button class="btn btn-outline" onclick="setFilter('proposta')" id="fProposta">Em Proposta</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Pesquisar cliente..." oninput="renderTable()">
  </div>

  <div class="card">
    <h3>Clientes</h3>
    <div id="tableWrap"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle">Novo Cliente</h3>
    <div class="form-group"><label>Nome</label><input type="text" id="fName"></div>
    <div class="form-group"><label>Empresa</label><input type="text" id="fCompany"></div>
    <div class="form-group"><label>Contacto</label><input type="text" id="fPhone"></div>
    <div class="form-group"><label>Email</label><input type="email" id="fEmail"></div>
    <div class="form-group"><label>Estado</label><select id="fStage"><option value="novo">Novo</option><option value="contactado">Contactado</option><option value="proposta">Em Proposta</option><option value="fechado">Fechado</option></select></div>
    <div class="form-group"><label>Notas</label><textarea id="fNotes"></textarea></div>
    <input type="hidden" id="fId">
    <button class="btn btn-primary" style="width:100%" onclick="saveClient()">Salvar</button>
  </div>
</div>

<script src="demo-shared.js"></script>
<script>
let currentFilter = 'todos';

function getClients() {
  return getData('crmClients', []);
}
function setClients(c) {
  setData('crmClients', c);
}

function seed() {
  if (getClients().length) return;
  const data = [
    { id:Date.now()+1, name:'João Nhaca', company:'Mecânica Central', phone:'82 123 4567', email:'joao@email.com', stage:'novo', notes:'Cliente potencial para sistema de gestão', created:'2026-05-20' },
    { id:Date.now()+2, name:'Maria Silva', company:'Farmácia Saúde', phone:'84 987 6543', email:'maria@email.com', stage:'proposta', notes:'Interessada no sistema de farmácia. Enviar proposta.', created:'2026-05-18' },
    { id:Date.now()+3, name:'Carlos Tembe', company:'Loja Nova', phone:'87 456 7890', email:'carlos@email.com', stage:'contactado', notes:'Ligar para agendar reunião', created:'2026-05-15' },
    { id:Date.now()+4, name:'Ana Paula', company:'Escola Primária', phone:'82 321 6547', email:'ana@email.com', stage:'fechado', notes:'Site institucional contratado. Em desenvolvimento.', created:'2026-05-10' },
    { id:Date.now()+5, name:'Pedro Mabila', company:'Restaurante Sabor', phone:'84 159 7532', email:'pedro@email.com', stage:'novo', notes:'Quer sistema PDV para o restaurante', created:'2026-05-22' },
    { id:Date.now()+6, name:'Lúcia Tembe', company:'Clínica Vida', phone:'82 753 9514', email:'lucia@email.com', stage:'proposta', notes:'Proposta de sistema de marcações enviada', created:'2026-05-12' },
  ];
  setClients(data);
}

function renderKPIs() {
  showLoading('kpis');
  const c = getClients();
  const total = c.length;
  const novos = c.filter(x => x.stage === 'novo').length;
  const proposta = c.filter(x => x.stage === 'proposta').length;
  const fechados = c.filter(x => x.stage === 'fechado').length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi-card"><div class="k-label">Total Clientes</div><div class="k-value">${total}</div></div>
    <div class="kpi-card"><div class="k-label">Novos (Lead)</div><div class="k-value" style="color:var(--green)">${novos}</div></div>
    <div class="kpi-card"><div class="k-label">Em Proposta</div><div class="k-value" style="color:var(--yellow)">${proposta}</div></div>
    <div class="kpi-card"><div class="k-label">Fechados</div><div class="k-value" style="color:var(--purple-l)">${fechados}</div></div>
  `;
  const stages = [
    { label:'Novo', count: novos, color:'var(--green)' },
    { label:'Contactado', count: c.filter(x => x.stage === 'contactado').length, color:'var(--blue)' },
    { label:'Proposta', count: proposta, color:'var(--yellow)' },
    { label:'Fechado', count: fechados, color:'var(--purple-l)' },
  ];
  document.getElementById('pipeline').innerHTML = stages.map(s =>
    `<div class="stage"><div class="count" style="color:${s.color}">${s.count}</div><div class="label">${s.label}</div></div>`
  ).join('');
  hideLoading('kpis');
}

function renderTable() {
  showLoading('tableWrap');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let c = getClients();
  if (currentFilter !== 'todos') c = c.filter(x => x.stage === currentFilter);
  c = c.filter(x => x.name.toLowerCase().includes(search) || x.company.toLowerCase().includes(search));
  const stageLabels = { novo:'Novo', contactado:'Contactado', proposta:'Em Proposta', fechado:'Fechado' };
  const stageClass = { novo:'tag-new', contactado:'tag-contact', proposta:'tag-proposal', fechado:'tag-closed' };
  const el = document.getElementById('tableWrap');
  if (!c.length) {
    el.innerHTML = '<div class="empty-state">Nenhum cliente encontrado</div>';
    hideLoading('tableWrap');
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>Nome</th><th>Empresa</th><th>Contacto</th><th>Estado</th><th>Data</th><th></th></tr></thead>
    <tbody>${c.map(x => `
      <tr>
        <td><strong>${esc(x.name)}</strong></td>
        <td>${esc(x.company)}</td>
        <td style="color:var(--text2)">${esc(x.phone)}</td>
        <td><span class="tag ${stageClass[x.stage]}">${stageLabels[x.stage]}</span></td>
        <td style="font-size:.78rem;color:var(--text2)">${esc(x.created)}</td>
        <td>
          <button class="btn-sm edit" onclick="editClient(${x.id})">Editar</button>
          <button class="btn-sm danger" onclick="deleteClient(${x.id})">Remover</button>
        </td>
      </tr>
    `).join('')}</tbody></table>`;
  hideLoading('tableWrap');
}

function setFilter(filter) {
  currentFilter = filter;
  ['fTodos','fNovo','fProposta'].forEach(id => document.getElementById(id).style.background = 'transparent');
  if (filter === 'todos') document.getElementById('fTodos').style.background = 'rgba(124,58,237,.15)';
  else if (filter === 'novo') document.getElementById('fNovo').style.background = 'rgba(124,58,237,.15)';
  else if (filter === 'proposta') document.getElementById('fProposta').style.background = 'rgba(124,58,237,.15)';
  renderTable();
}

function openModal(data) {
  document.getElementById('modal').classList.add('open');
  document.getElementById('fId').value = data ? data.id : '';
  document.getElementById('fName').value = data ? data.name : '';
  document.getElementById('fCompany').value = data ? data.company : '';
  document.getElementById('fPhone').value = data ? data.phone : '';
  document.getElementById('fEmail').value = data ? data.email : '';
  document.getElementById('fStage').value = data ? data.stage : 'novo';
  document.getElementById('fNotes').value = data ? data.notes : '';
  document.getElementById('modalTitle').textContent = data ? 'Editar Cliente' : 'Novo Cliente';
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function saveClient() {
  clearAllFieldErrors();
  const id = document.getElementById('fId').value;
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  let hasErr = false;
  if (!name) { showFieldError('fName', 'Nome é obrigatório'); hasErr = true; }
  if (!phone) { showFieldError('fPhone', 'Contacto é obrigatório'); hasErr = true; }
  if (!email) { showFieldError('fEmail', 'Email é obrigatório'); hasErr = true; }
  if (hasErr) return;
  const c = getClients();
  const data = {
    name, company: document.getElementById('fCompany').value.trim(),
    phone, email,
    stage: document.getElementById('fStage').value,
    notes: document.getElementById('fNotes').value.trim(),
    created: new Date().toISOString().split('T')[0],
  };
  if (id) {
    const idx = c.findIndex(x => x.id == id);
    if (idx >= 0) c[idx] = { ...c[idx], ...data };
  } else {
    c.push({ id: Date.now(), ...data });
  }
  setClients(c);
  closeModal();
  renderKPIs();
  renderTable();
  showToast(id ? 'Cliente actualizado' : 'Cliente adicionado', 'success');
}

function editClient(id) {
  const c = getClients().find(x => x.id === id);
  if (c) openModal(c);
}

async function deleteClient(id) {
  if (!(await showConfirm('Remover este cliente?'))) return;
  setClients(getClients().filter(x => x.id !== id));
  renderKPIs();
  renderTable();
  showToast('Cliente removido', 'info');
}

seed();
renderKPIs();
renderTable();
</script>
</body>
</html>

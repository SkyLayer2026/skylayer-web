<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcações — SkyLayer Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080809;--bg2:#0e0e10;--card:#141418;--purple:#7c3aed;--purple-l:#be8bf5;--border:#1e1e24;--text:#f0f0f2;--text2:#9494a0;--green:#25d366;--radius:12px;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.demo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.demo-header h2{font-size:1rem;font-weight:700}
.demo-header h2 span{color:var(--purple-l)}
.demo-header a{color:var(--text2);font-size:.85rem;text-decoration:none}
.demo-header a:hover{color:var(--purple-l)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.header-info{margin-bottom:32px}
.header-info h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.header-info p{color:var(--text2);font-size:.95rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card h3{font-size:1.05rem;font-weight:700;margin-bottom:16px}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.calendar-header button{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.2);color:var(--purple-l);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.1rem;transition:all .3s}
.calendar-header button:hover{background:rgba(124,58,237,.25)}
.calendar-header span{font-weight:700;font-size:.95rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-grid .day-name{text-align:center;font-size:.7rem;color:var(--text2);font-weight:600;text-transform:uppercase;padding:6px 0}
.cal-grid .day{text-align:center;padding:8px 4px;border-radius:8px;font-size:.82rem;cursor:pointer;transition:all .2s;border:1px solid transparent;color:var(--text2)}
.cal-grid .day:hover{border-color:rgba(124,58,237,.3);background:rgba(124,58,237,.06)}
.cal-grid .day.selected{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff;border-color:transparent}
.cal-grid .day.today{border-color:rgba(124,58,237,.3)}
.cal-grid .day.other{opacity:.25}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.slot{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;color:var(--text2);transition:all .3s;font-family:var(--font)}
.slot:hover{border-color:rgba(124,58,237,.3);color:var(--text)}
.slot.selected-slot{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff;border-color:transparent}
.slot.booked{background:rgba(255,95,87,.12);color:var(--text2);text-decoration:line-through;cursor:not-allowed;border-color:rgba(255,95,87,.15)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:5px;font-weight:600}
.form-group input{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.form-group input:focus{border-color:var(--purple)}
.btn{padding:11px 24px;border-radius:8px;font-weight:600;font-size:.88rem;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff;width:100%}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.3)}
.appointment-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:.85rem;transition:all .2s}.appointment-item:hover{background:rgba(124,58,237,.03)}
.appointment-item:last-child{border-bottom:none}
.appointment-item .info{display:flex;flex-direction:column;gap:2px}
.appointment-item .name{font-weight:600}
.appointment-item .detail{color:var(--text2);font-size:.78rem}
.appointment-item .time{color:var(--purple-l);font-weight:700;font-size:.82rem}
.btn-sm{padding:5px 12px;font-size:.75rem;background:rgba(255,95,87,.12);color:#ff5f57;border:1px solid rgba(255,95,87,.2);border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .2s}
.btn-sm:hover{background:rgba(255,95,87,.2)}
.empty-state{text-align:center;padding:24px;color:var(--text2);font-size:.85rem}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}.cal-grid{gap:2px}.cal-grid .day{font-size:.72rem;padding:5px 2px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}}@media(max-width:480px){.cal-grid .day{font-size:.65rem;padding:4px 1px}.slots{grid-template-columns:repeat(2,1fr)}.card{padding:16px}}
</style>
</head>
<body>

<div class="demo-header">
  <h2>Sky<span>Layer</span> — Marcações</h2>
  <a href="index.html">&larr; Voltar</a>
</div>

<div class="container">
  <div class="header-info">
    <span style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--purple-l)">Plataforma de Agendamentos</span>
    <h1>Sistema de Marcações Online</h1>
    <p>Agende consultas e serviços de forma rápida e organizada.</p>
  </div>

  <div class="grid-2">
    <div>
      <div class="card" style="margin-bottom:24px">
        <h3>Calendário</h3>
        <div class="calendar-header">
          <button onclick="prevMonth()">&larr;</button>
          <span id="monthLabel">Janeiro 2026</span>
          <button onclick="nextMonth()">&rarr;</button>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>
      </div>

      <div class="card">
        <h3>Horários Disponíveis</h3>
        <div id="slotsContainer">
          <div class="empty-state">Seleccione uma data no calendário</div>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>Nova Marcação</h3>
        <div class="form-group"><label>Nome do Cliente</label><input type="text" id="clientName" placeholder="Nome completo"></div>
        <div class="form-group"><label>Contacto</label><input type="text" id="clientContact" placeholder="Telefone ou email"></div>
        <div class="form-group"><label>Serviço</label><input type="text" id="serviceName" placeholder="ex: Consulta geral, Corte de cabelo"></div>
        <button class="btn btn-primary" onclick="bookAppointment()">Agendar Marcação</button>
      </div>

      <div class="card" style="margin-top:24px">
        <h3>Marcações Agendadas</h3>
        <div id="appointmentsList"></div>
      </div>
    </div>
  </div>
</div>

<script src="demo-shared.js"></script>
<script>
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = null;
let selectedSlot = null;

function getAppointments() {
  return getData('bookingAppointments', []);
}

function setAppointments(a) {
  setData('bookingAppointments', a);
}

function seedAppointments() {
  if (getAppointments().length) return;
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const data = [
    { id: Date.now()+1, client: 'Maria Silva', contact: '84 123 4567', service: 'Consulta geral', date: tomorrow.toISOString().split('T')[0], time: '09:00' },
    { id: Date.now()+2, client: 'João Pedro', contact: '82 987 6543', service: 'Corte de cabelo', date: tomorrow.toISOString().split('T')[0], time: '14:30' },
  ];
  setAppointments(data);
}

const TIME_SLOTS = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30'];

function renderCalendar() {
  showLoading('calendarGrid');
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('monthLabel').textContent = `${months[currentMonth]} ${currentYear}`;
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  let html = '<div class="day-name">Dom</div><div class="day-name">Seg</div><div class="day-name">Ter</div><div class="day-name">Qua</div><div class="day-name">Qui</div><div class="day-name">Sex</div><div class="day-name">Sáb</div>';
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const isPast = dateStr < todayStr;
    html += `<div class="day${isSelected?' selected':''}${isToday?' today':''}${isPast?' other':''}" onclick="${isPast?'':`selectDate('${dateStr}')`}">${d}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML = html;
  hideLoading('calendarGrid');
  if (selectedDate) renderSlots();
}

function selectDate(date) {
  selectedDate = date;
  selectedSlot = null;
  renderCalendar();
}

function renderSlots() {
  if (!selectedDate) {
    document.getElementById('slotsContainer').innerHTML = '<div class="empty-state">Seleccione uma data no calendário</div>';
    return;
  }
  const apps = getAppointments().filter(a => a.date === selectedDate);
  const bookedTimes = apps.map(a => a.time);
  const today = new Date();
  const dateObj = new Date(selectedDate + 'T00:00:00');
  const isPast = dateObj < new Date(today.toISOString().split('T')[0]);
  document.getElementById('slotsContainer').innerHTML = `
    <div style="margin-bottom:12px;font-size:.82rem;color:var(--text2)">Data: <strong>${selectedDate}</strong></div>
    <div class="slots">${TIME_SLOTS.map(t => {
      const booked = bookedTimes.includes(t);
      const disabled = booked || isPast;
      return `<button class="slot${selectedSlot===t?' selected-slot':''}${booked?' booked':''}" ${disabled?'disabled':''} onclick="${disabled?'':`selectSlot('${t}')`}">${t}</button>`;
    }).join('')}</div>
    ${selectedSlot ? `<div style="font-size:.82rem;color:var(--purple-l)">Horário seleccionado: <strong>${selectedSlot}</strong></div>` : ''}
  `;
}

function selectSlot(t) {
  selectedSlot = t;
  renderSlots();
}

function bookAppointment() {
  if (!selectedDate || !selectedSlot) { showToast('Seleccione uma data e hor\u00e1rio', 'warning'); return; }
  clearAllFieldErrors();
  const name = document.getElementById('clientName').value.trim();
  const contact = document.getElementById('clientContact').value.trim();
  const service = document.getElementById('serviceName').value.trim();
  let valid = true;
  if (!name) { showFieldError('clientName', 'Nome é obrigatório'); valid = false; }
  if (!contact) { showFieldError('clientContact', 'Contacto é obrigatório'); valid = false; }
  if (!valid) return;
  const apps = getAppointments();
  if (apps.some(a => a.date === selectedDate && a.time === selectedSlot)) { showToast('Este hor\u00e1rio j\u00e1 est\u00e1 reservado', 'warning'); return; }
  apps.push({ id: Date.now(), client: name, contact, service: service || '\u2014', date: selectedDate, time: selectedSlot });
  setAppointments(apps);
  document.getElementById('clientName').value = '';
  document.getElementById('clientContact').value = '';
  document.getElementById('serviceName').value = '';
  selectedSlot = null;
  renderSlots();
  renderAppointments();
  showToast('Marca\u00e7\u00e3o agendada com sucesso!', 'success');
}

function renderAppointments() {
  showLoading('appointmentsList');
  const apps = getAppointments().sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  const el = document.getElementById('appointmentsList');
  if (!apps.length) {
    el.innerHTML = '<div class="empty-state">Nenhuma marcação agendada</div>';
    hideLoading('appointmentsList');
    return;
  }
  el.innerHTML = apps.map(a => `
    <div class="appointment-item">
      <div class="info">
        <div class="name">${esc(a.client)}</div>
        <div class="detail">${esc(a.service)} &middot; ${esc(a.contact)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="time">${a.date.split('-').reverse().join('/')}<br><span style="font-size:.75rem">${a.time}</span></div>
        <button class="btn-sm" onclick="cancelAppointment(${a.id})">Cancelar</button>
      </div>
    </div>
  `).join('');
  hideLoading('appointmentsList');
}

async function cancelAppointment(id) {
  if (!(await showConfirm('Cancelar esta marca\u00e7\u00e3o?'))) return;
  setAppointments(getAppointments().filter(a => a.id !== id));
  renderAppointments();
  renderSlots();
  showToast('Marca\u00e7\u00e3o cancelada', 'info');
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  selectedDate = null;
  selectedSlot = null;
  renderCalendar();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  selectedDate = null;
  selectedSlot = null;
  renderCalendar();
}

seedAppointments();
renderCalendar();
renderAppointments();
</script>
</body>
</html>

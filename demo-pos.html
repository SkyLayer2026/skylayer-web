<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV — SkyLayer Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080809;--bg2:#0e0e10;--card:#141418;--purple:#7c3aed;--purple-l:#be8bf5;--border:#1e1e24;--text:#f0f0f2;--text2:#9494a0;--green:#25d366;--radius:12px;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.demo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.demo-header h2{font-size:1rem;font-weight:700}
.demo-header h2 span{color:var(--purple-l)}
.demo-header a{color:var(--text2);font-size:.85rem;text-decoration:none}
.demo-header a:hover{color:var(--purple-l)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.header-info{margin-bottom:24px}
.header-info h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.header-info p{color:var(--text2);font-size:.95rem}
.pos-grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .3s}
.prod-card:hover{border-color:rgba(124,58,237,.3);transform:translateY(-3px)}
.prod-card .price{font-size:1.1rem;font-weight:800;color:var(--purple-l);margin:6px 0}
.prod-card .name{font-size:.82rem;color:var(--text2)}
.cart-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;height:fit-content;position:sticky;top:90px}
.cart-panel h3{font-size:1rem;font-weight:700;margin-bottom:16px}
.cart-items{max-height:320px;overflow-y:auto;margin-bottom:16px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem;transition:all .2s}.cart-item:hover{background:rgba(124,58,237,.03)}
.cart-item .qty{display:flex;align-items:center;gap:8px}
.cart-item .qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cart-item .qty button:hover{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.3)}
.cart-item .item-total{font-weight:600;color:var(--purple-l)}
.cart-divider{height:1px;background:var(--border);margin:8px 0}
.cart-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-bottom:16px}
.cart-total .amount{color:var(--purple-l)}
.payment-row{display:flex;gap:8px;margin-bottom:12px}
.payment-row input{flex:1;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.payment-row input:focus{border-color:var(--purple)}
.change-row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--text2);margin-bottom:16px}
.change-row .val{color:var(--green);font-weight:700}
.btn{padding:11px 0;border-radius:8px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:all .3s;font-family:var(--font);width:100%}
.btn-primary{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,211,102,.3)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--purple-l);color:var(--purple-l)}
.cat-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cat-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.8rem;font-family:var(--font);transition:all .3s}
.cat-btn.active,.cat-btn:hover{border-color:var(--purple);color:var(--purple-l);background:rgba(124,58,237,.08)}
.empty-cart{text-align:center;padding:30px 0;color:var(--text2);font-size:.85rem}
.confirm-overlay{z-index:300}
.receipt-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;z-index:200}
.receipt-overlay.open{display:flex}
.receipt-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:420px}
.receipt-box h3{font-size:1.1rem;font-weight:700;margin-bottom:16px;text-align:center}
.receipt-box .receipt-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.receipt-box .receipt-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;padding:12px 0 8px;color:var(--purple-l)}
.receipt-box .receipt-detail{color:var(--text2);font-size:.8rem;margin:4px 0}
.receipt-box .btn{width:100%;margin-top:16px}
@media(max-width:768px){.pos-grid{grid-template-columns:1fr}.products-grid{grid-template-columns:repeat(2,1fr)}.cat-filter{flex-wrap:wrap}}@media(max-width:480px){.products-grid{grid-template-columns:1fr}.payment-row{flex-direction:column}}
</style>
</head>
<body>

<div class="demo-header">
  <h2>Sky<span>Layer</span> — PDV</h2>
  <a href="index.html">&larr; Voltar</a>
</div>

<div class="container">
  <div class="header-info">
    <span style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--purple-l)">Ponto de Venda</span>
    <h1>Sistema PDV — Ponto de Venda</h1>
    <p>Registo rápido de vendas com cálculo automático de troco.</p>
  </div>

  <div class="cat-filter" id="catFilter"></div>

  <div class="pos-grid">
    <div>
      <div class="products-grid" id="productsGrid"></div>
      <div style="text-align:center;padding:20px;color:var(--text2);font-size:.82rem" id="saleCount"></div>
    </div>

    <div class="cart-panel">
      <h3>Carrinho</h3>
      <div class="cart-items" id="cartItems">
        <div class="empty-cart">Clique nos produtos para adicionar</div>
      </div>
      <div class="cart-divider"></div>
      <div class="cart-total"><span>Total</span><span class="amount" id="totalAmount">0.00 MT</span></div>
      <div class="payment-row">
        <input type="number" id="amountPaid" placeholder="Valor pago (MT)" min="0" step="0.01" oninput="calcChange()">
      </div>
      <div class="change-row"><span>Troco</span><span class="val" id="changeAmount">0.00 MT</span></div>
      <button class="btn btn-success" onclick="checkout()">Finalizar Venda</button>
      <button class="btn btn-outline" style="margin-top:8px" onclick="clearCart()">Limpar Carrinho</button>
    </div>
  </div>
</div>

<script src="demo-shared.js"></script>
<script>
const PRODUCTS = [
  { id:1, name:'Arroz 5kg', cat:'Alimentação', price:180 },
  { id:2, name:'Óleo Alimentar 2L', cat:'Alimentação', price:120 },
  { id:3, name:'Farinha de Milho 5kg', cat:'Alimentação', price:150 },
  { id:4, name:'Açúcar 1kg', cat:'Alimentação', price:65 },
  { id:5, name:'Leite Líquido 1L', cat:'Alimentação', price:80 },
  { id:6, name:'Sabão em Pó 500g', cat:'Limpeza', price:90 },
  { id:7, name:'Detergente Líquido 500ml', cat:'Limpeza', price:75 },
  { id:8, name:'Água Sanitária 1L', cat:'Limpeza', price:55 },
  { id:9, name:'Shampoo 200ml', cat:'Higiene', price:120 },
  { id:10, name:'Pasta de Dentes', cat:'Higiene', price:45 },
  { id:11, name:'Sabonete', cat:'Higiene', price:25 },
  { id:12, name:'Coca-Cola 2L', cat:'Bebidas', price:70 },
  { id:13, name:'Água Mineral 1.5L', cat:'Bebidas', price:40 },
  { id:14, name:'Sumo 1L', cat:'Bebidas', price:55 },
];

let cart = [];
let activeCat = 'Todas';
let sales = getData('posSales', 0);

function getCategories() {
  const cats = ['Todas', ...new Set(PRODUCTS.map(p => p.cat))];
  document.getElementById('catFilter').innerHTML = cats.map(c =>
    `<button class="cat-btn${c===activeCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}

function setCat(c) {
  activeCat = c;
  getCategories();
  renderProducts();
}

function renderProducts() {
  showLoading('productsGrid');
  const filtered = activeCat === 'Todas' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
  document.getElementById('productsGrid').innerHTML = filtered.map(p => `
    <div class="prod-card" onclick="addToCart(${p.id})">
      <div class="price">${p.price.toFixed(0)} MT</div>
      <div class="name">${p.name}</div>
    </div>
  `).join('');
  hideLoading('productsGrid');
  document.getElementById('saleCount').textContent = `Vendas de hoje: ${sales}`;
}

function addToCart(id) {
  const existing = cart.find(c => c.id === id);
  if (existing) existing.qty++;
  else cart.push({ ...PRODUCTS.find(p => p.id === id), qty: 1 });
  renderCart();
  showToast('Adicionado ao carrinho', 'success');
}

function updateQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  renderCart();
}

function renderCart() {
  const el = document.getElementById('cartItems');
  if (!cart.length) {
    el.innerHTML = '<div class="empty-cart">Clique nos produtos para adicionar</div>';
    document.getElementById('totalAmount').textContent = '0.00 MT';
    return;
  }
  let total = 0;
  el.innerHTML = cart.map(item => {
    total += item.price * item.qty;
    return `<div class="cart-item">
      <div>${item.name}</div>
      <div class="qty">
        <button onclick="updateQty(${item.id},-1)">−</button>
        <span>${item.qty}</span>
        <button onclick="updateQty(${item.id},1)">+</button>
        <span class="item-total">${(item.price*item.qty).toFixed(0)} MT</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('totalAmount').textContent = `${total.toFixed(2)} MT`;
  calcChange();
}

function calcChange() {
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const paid = parseFloat(document.getElementById('amountPaid').value) || 0;
  document.getElementById('changeAmount').textContent = paid >= total ? `${(paid-total).toFixed(2)} MT` : '0.00 MT';
}

async function clearCart() {
  if (!cart.length) return;
  if (!(await showConfirm('Limpar carrinho?'))) return;
  cart = [];
  document.getElementById('amountPaid').value = '';
  renderCart();
  showToast('Carrinho limpo', 'info');
}

function showReceipt(total, paid, change) {
  const overlay = document.createElement('div');
  overlay.className = 'receipt-overlay open';
  overlay.innerHTML = '<div class="receipt-box"><h3>\u2705 Venda Finalizada</h3>'
    + cart.map(i => '<div class="receipt-item"><span>' + i.name + ' x' + i.qty + '</span><span>' + (i.price * i.qty).toFixed(0) + ' MT</span></div>').join('')
    + '<div class="receipt-total"><span>Total</span><span>' + total.toFixed(2) + ' MT</span></div>'
    + '<div class="receipt-detail">Valor pago: <strong>' + paid.toFixed(2) + ' MT</strong></div>'
    + '<div class="receipt-detail">Troco: <strong style="color:var(--green)">' + change.toFixed(2) + ' MT</strong></div>'
    + '<button class="btn btn-primary" onclick="this.closest(\'.receipt-overlay\').remove()">Fechar</button></div>';
  document.body.appendChild(overlay);
}

function checkout() {
  clearAllFieldErrors();
  if (!cart.length) { showToast('Carrinho vazio', 'warning'); return; }
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const paid = parseFloat(document.getElementById('amountPaid').value) || 0;
  if (!paid || paid < total) { showFieldError('amountPaid', 'Valor pago insuficiente'); showToast('Valor pago insuficiente', 'warning'); return; }
  clearFieldError('amountPaid');
  const change = paid - total;
  sales++;
  setData('posSales', sales);
  showReceipt(total, paid, change);
  cart = [];
  document.getElementById('amountPaid').value = '';
  renderCart();
  renderProducts();
}

getCategories();
renderProducts();
</script>
</body>
</html>

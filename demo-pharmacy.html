<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmácia — SkyLayer Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080809;--bg2:#0e0e10;--card:#141418;--purple:#7c3aed;--purple-l:#be8bf5;--border:#1e1e24;--text:#f0f0f2;--text2:#9494a0;--green:#25d366;--red:#ff5f57;--radius:12px;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.demo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.demo-header h2{font-size:1rem;font-weight:700}
.demo-header h2 span{color:var(--purple-l)}
.demo-header a{color:var(--text2);font-size:.85rem;text-decoration:none}
.demo-header a:hover{color:var(--purple-l)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.header-info{margin-bottom:32px}
.header-info h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.header-info p{color:var(--text2);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.stat-card .num{font-size:1.4rem;font-weight:800;color:var(--purple-l)}
.stat-card .lbl{font-size:.78rem;color:var(--text2);margin-top:4px}
.actions{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn-outline{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
.btn-outline:hover{border-color:var(--purple-l);color:var(--purple-l)}
.btn-sm.edit{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.2);padding:4px 10px;font-size:.78rem;border-radius:6px;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .3s}
.btn-sm.edit:hover{background:rgba(96,165,250,.2)}
.btn-danger{background:rgba(255,95,87,.12);color:var(--red);border:1px solid rgba(255,95,87,.2)}
.btn-danger:hover{background:rgba(255,95,87,.2)}
.search-bar{display:flex;gap:12px;margin-bottom:20px}
.search-bar input{flex:1;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.search-bar input:focus{border-color:var(--purple)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:.88rem;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(124,58,237,.03)}
.tag{padding:3px 10px;border-radius:5px;font-size:.72rem;font-weight:600}
.tag-ok{background:rgba(37,211,102,.12);color:var(--green)}
.tag-warn{background:rgba(245,166,35,.12);color:#f5a623}
.tag-danger{background:rgba(255,95,87,.12);color:var(--red)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:90%;max-width:480px;position:relative}
.modal-box h3{font-size:1.1rem;font-weight:700;margin-bottom:20px}
.modal-box .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text2);font-size:1.4rem;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:5px;font-weight:600}
.form-group input{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.form-group input:focus{border-color:var(--purple)}
.modal-overlay{transition:opacity .25s ease}
.modal-box{animation:modalIn .25s ease}@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.stat-card{transition:transform .3s ease,box-shadow .3s ease}.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.12)}
tr{transition:background .2s ease}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.table-wrap{overflow-x:auto}.table-wrap table{min-width:600px}.modal-box{padding:20px}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.container{padding:24px 16px}}
@media(prefers-reduced-motion:no-preference){.stat-card{transition:transform .3s ease,box-shadow .3s ease}}
</style>
</head>
<body>

<div class="demo-header">
  <h2>Sky<span>Layer</span> — Farmácia</h2>
  <a href="index.html">&larr; Voltar</a>
</div>

<div class="container">
  <div class="header-info">
    <span style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--purple-l)">Gestão Empresarial</span>
    <h1>Sistema de Gestão de Farmácia</h1>
    <p>Gestão de inventário, controlo de validades e vendas.</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="actions">
    <button class="btn btn-primary" onclick="openModal()">+ Novo Produto</button>
    <button class="btn btn-outline" onclick="exportData()">Exportar</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Pesquisar produto..." oninput="renderTable()">
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Produto</th>
        <th>Categoria</th>
        <th>Stock</th>
        <th>Preço</th>
        <th>Validade</th>
        <th>Estado</th>
        <th></th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle">Novo Produto</h3>
    <div class="form-group"><label>Nome do Produto</label><input type="text" id="fName"></div>
     <div class="form-group"><label>Categoria</label><select id="fCat"></select></div>
    <div class="form-group"><label>Quantidade em Stock</label><input type="number" id="fQty" min="0"></div>
    <div class="form-group"><label>Preço (MT)</label><input type="number" id="fPrice" min="0" step="0.01"></div>
    <div class="form-group"><label>Data de Validade</label><input type="date" id="fExp"></div>
    <input type="hidden" id="fId">
    <button class="btn btn-primary" style="width:100%" onclick="saveProduct()">Salvar</button>
  </div>
</div>

<script src="demo-shared.js"></script>
<script>
const CATEGORIES = ['Medicamento','Higiene','Suplemento','Cosm\u00e9tico','Infantil'];

function populateCategories(selected) {
  const s = document.getElementById('fCat');
  s.innerHTML = CATEGORIES.map(c => '<option value="' + c + '"' + (c === selected ? ' selected' : '') + '>' + c + '</option>').join('');
}

function getProducts() {
  return getData('pharmacyProducts', []);
}

function setProducts(p) {
  setData('pharmacyProducts', p);
}

function seedData() {
  if (getProducts().length) return;
  const now = new Date();
  const data = [
    { id: Date.now()+1, name:'Paracetamol 500mg', cat:'Medicamento', qty:120, price:45.00, exp: new Date(now.getTime()+180*86400000).toISOString().split('T')[0] },
    { id: Date.now()+2, name:'Amoxicilina 250mg', cat:'Medicamento', qty:5, price:120.00, exp: new Date(now.getTime()+90*86400000).toISOString().split('T')[0] },
    { id: Date.now()+3, name:'Álcool Gel 500ml', cat:'Higiene', qty:45, price:85.00, exp: new Date(now.getTime()+365*86400000).toISOString().split('T')[0] },
    { id: Date.now()+4, name:'Máscara Cirúrgica cx50', cat:'Higiene', qty:2, price:150.00, exp: new Date(now.getTime()+730*86400000).toISOString().split('T')[0] },
    { id: Date.now()+5, name:'Vitamina C 1000mg', cat:'Suplemento', qty:30, price:250.00, exp: new Date(now.getTime()+240*86400000).toISOString().split('T')[0] },
  ];
  setProducts(data);
}

function renderStats() {
  const p = getProducts();
  const total = p.reduce((s, x) => s + x.qty, 0);
  const value = p.reduce((s, x) => s + x.qty * x.price, 0);
  const expired = p.filter(x => x.exp && x.exp < new Date().toISOString().split('T')[0]).length;
  const low = p.filter(x => x.qty <= 10).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${p.length}</div><div class="lbl">Produtos</div></div>
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Unidades em Stock</div></div>
    <div class="stat-card"><div class="num">${value.toFixed(0)} MT</div><div class="lbl">Valor Total</div></div>
    <div class="stat-card"><div class="num" style="color:${low>0||expired>0?'var(--red)':'var(--purple-l)'}">${low+expired}</div><div class="lbl">Alertas</div></div>
  `;
}

function renderTable() {
  showLoading('tableBody');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const p = getProducts().filter(x => x.name.toLowerCase().includes(search));
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tableBody').innerHTML = p.length ? p.map(x => {
    let tag = '<span class="tag tag-ok">OK</span>';
    if (x.qty <= 3 || (x.exp && x.exp < today)) tag = '<span class="tag tag-danger">Crítico</span>';
    else if (x.qty <= 10 || (x.exp && x.exp < new Date(Date.now()+60*86400000).toISOString().split('T')[0])) tag = '<span class="tag tag-warn">Atenção</span>';
    return `<tr>
      <td><strong>${esc(x.name)}</strong></td>
      <td>${esc(x.cat)}</td>
      <td>${x.qty}</td>
      <td>${x.price.toFixed(2)} MT</td>
      <td style="font-size:.82rem">${x.exp || '—'}</td>
      <td>${tag}</td>
      <td><button class="btn-sm edit" style="padding:4px 10px;font-size:.78rem" onclick="editProduct(${x.id})">Editar</button> <button class="btn btn-danger" style="padding:4px 10px;font-size:.78rem" onclick="deleteProduct(${x.id})">Remover</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text2)">Nenhum produto encontrado</td></tr>';
  hideLoading('tableBody');
  renderStats();
}

function openModal(data) {
  populateCategories(data ? data.cat : '');
  document.getElementById('modal').classList.add('open');
  document.getElementById('fId').value = data ? data.id : '';
  document.getElementById('fName').value = data ? data.name : '';
  document.getElementById('fQty').value = data ? data.qty : '';
  document.getElementById('fPrice').value = data ? data.price : '';
  document.getElementById('fExp').value = data ? data.exp : '';
  document.getElementById('modalTitle').textContent = data ? 'Editar Produto' : 'Novo Produto';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function editProduct(id) {
  const p = getProducts().find(x => x.id === id);
  if (p) openModal(p);
}

function saveProduct() {
  clearAllFieldErrors();
  const id = document.getElementById('fId').value;
  const name = document.getElementById('fName').value.trim();
  const cat = document.getElementById('fCat').value;
  const qty = parseInt(document.getElementById('fQty').value);
  const price = parseFloat(document.getElementById('fPrice').value);
  const exp = document.getElementById('fExp').value;
  let hasErr = false;
  if (!name) { showFieldError('fName', 'Nome é obrigatório'); hasErr = true; }
  if (isNaN(qty) || qty < 0) { showFieldError('fQty', 'Quantidade inválida'); hasErr = true; }
  if (isNaN(price) || price < 0) { showFieldError('fPrice', 'Preço inválido'); hasErr = true; }
  if (hasErr) return;
  let p = getProducts();
  if (id) {
    const idx = p.findIndex(x => x.id == id);
    if (idx >= 0) { p[idx] = { ...p[idx], name, cat, qty: qty||0, price: price||0, exp }; }
  } else {
    p.push({ id: Date.now(), name, cat, qty: qty||0, price: price||0, exp });
  }
  setProducts(p);
  closeModal();
  renderTable();
  showToast(id ? 'Produto actualizado' : 'Produto adicionado', 'success');
}

async function deleteProduct(id) {
  if (!(await showConfirm('Remover este produto?'))) return;
  let p = getProducts().filter(x => x.id !== id);
  setProducts(p);
  renderTable();
  showToast('Produto removido', 'info');
}

function exportData() {
  const p = getProducts();
  let csv = 'Produto,Categoria,Stock,Preço,Validade\n';
  p.forEach(x => { csv += `${x.name},${x.cat},${x.qty},${x.price},${x.exp}\n`; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'farmacia_stock.csv';
  a.click();
}

seedData();
populateCategories();
renderTable();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia Lurio - Painel Central</title>
  <style>
    :root { --bg: #f4f6f9; --card: #fff; --primary: #0d47a1; --text: #1a1a1a; --border: #e0e0e0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    header { background: var(--primary); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { font-size: 0.9rem; color: #666; margin-bottom: 8px; }
    .card .value { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #e3f2fd; font-weight: 600; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    .ok { background: #d4edda; color: #155724; }
    .warn { background: #fff3cd; color: #856400; }
    .footer { text-align: center; margin-top: 20px; color: #888; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>💊 Farmácia Lurio - Painel Central</h1>
    <span id="clock"></span>
  </header>

  <div class="grid">
    <div class="card"><h3>Vendas Hoje</h3><div class="value" id="salesMT">0,00 MT</div></div>
    <div class="card"><h3>Transações</h3><div class="value" id="salesCount">0</div></div>
    <div class="card"><h3>Margem Bruta (Est.)</h3><div class="value" id="profit">--</div></div>
  </div>

  <h2 style="margin: 20px 0 10px;">📊 Desempenho por Unidade</h2>
  <table>
    <thead><tr><th>Unidade</th><th>Vendas Hoje</th><th>Valor Total</th><th>Última Sync</th><th>Status</th></tr></thead>
    <tbody id="branchTable"></tbody>
  </table>

  <div class="footer">
    Atualização automática a cada 15s • Farmácia Lurio © 2024
  </div>

  <script>
    const API_URL = '/api/stats';
    function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('pt-BR'); }
    setInterval(updateClock, 1000); updateClock();

    async function loadStats() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        document.getElementById('salesMT').textContent = data.today.totalMT.toFixed(2) + ' MT';
        document.getElementById('salesCount').textContent = data.today.totalTransactions;
        document.getElementById('profit').textContent = (data.today.totalMT * 0.3).toFixed(2) + ' MT'; // Estimativa 30%

        const tbody = document.getElementById('branchTable');
        tbody.innerHTML = data.branches.map(b => {
          const lastSync = new Date(b.last_sync || Date.now());
          const diffMin = (Date.now() - lastSync) / 60000;
          const status = diffMin < 30 ? '<span class="status ok">Online</span>' : '<span class="status warn">Offline</span>';
          return `<tr>
            <td>${b.branch.toUpperCase()}</td>
            <td>${b.count}</td>
            <td>${b.total.toFixed(2)} MT</td>
            <td>${lastSync.toLocaleTimeString('pt-BR')}</td>
            <td>${status}</td>
          </tr>`;
        }).join('');
      } catch (e) { console.error('Erro ao carregar dados:', e); }
    }

    loadStats();
    setInterval(loadStats, 15000);
  </script>
</body>
</html>

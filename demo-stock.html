<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Stock — SkyLayer Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080809;--bg2:#0e0e10;--card:#141418;--purple:#7c3aed;--purple-l:#be8bf5;--border:#1e1e24;--text:#f0f0f2;--text2:#9494a0;--green:#25d366;--red:#ff5f57;--yellow:#f5a623;--radius:12px;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.demo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.demo-header h2{font-size:1rem;font-weight:700}
.demo-header h2 span{color:var(--purple-l)}
.demo-header a{color:var(--text2);font-size:.85rem;text-decoration:none}
.demo-header a:hover{color:var(--purple-l)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.header-info{margin-bottom:24px}
.header-info h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.header-info p{color:var(--text2);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center}
.stat-card .num{font-size:1.5rem;font-weight:800;color:var(--purple-l)}
.stat-card .lbl{font-size:.78rem;color:var(--text2);margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--card);border-radius:10px;padding:4px;border:1px solid var(--border);width:fit-content}
.tab{padding:8px 20px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text2);transition:all .3s;border:none;background:none;font-family:var(--font)}
.tab.active{background:var(--purple);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:all .3s;font-family:var(--font)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#9555f0);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--purple-l);color:var(--purple-l)}
.btn-sm.edit{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.2);padding:6px 14px;font-size:.78rem;border-radius:6px;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .3s}
.btn-sm.edit:hover{background:rgba(96,165,250,.2)}
.btn-danger{background:rgba(255,95,87,.12);color:var(--red);border:1px solid rgba(255,95,87,.2);padding:6px 14px;font-size:.78rem}
.btn-danger:hover{background:rgba(255,95,87,.2)}
.search-bar input{width:100%;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.search-bar input:focus{border-color:var(--purple)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
td{padding:11px 14px;font-size:.85rem;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(124,58,237,.03)}
.tag{padding:3px 9px;border-radius:5px;font-size:.7rem;font-weight:600}
.tag-ok{background:rgba(37,211,102,.12);color:var(--green)}
.tag-warn{background:rgba(245,166,35,.12);color:var(--yellow)}
.tag-danger{background:rgba(255,95,87,.12);color:var(--red)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:440px;position:relative}
.modal-box h3{font-size:1.05rem;font-weight:700;margin-bottom:18px}
.modal-box .close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text2);font-size:1.3rem;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:5px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--purple)}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:.88rem}
.modal-overlay{transition:opacity .25s ease}
.modal-box{animation:modalIn .25s ease}@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.stat-card{transition:transform .3s ease,box-shadow .3s ease}.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,.12)}
tr{transition:background .2s ease}
.tab{transition:all .3s ease}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.tabs{overflow-x:auto;width:100%;flex-wrap:nowrap}.tabs .tab{white-space:nowrap;flex-shrink:0}#tableContainer{overflow-x:auto}#tableContainer table{min-width:600px}.modal-box{padding:20px}.form-group input,.form-group select{font-size:.85rem}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.container{padding:24px 16px}}
@media(prefers-reduced-motion:no-preference){.stat-card{transition:transform .3s ease,box-shadow .3s ease}}
</style>
</head>
<body>

<div class="demo-header">
  <h2>Sky<span>Layer</span> — Gestão de Stock</h2>
  <a href="index.html">&larr; Voltar</a>
</div>

<div class="container">
  <div class="header-info">
    <span style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--purple-l)">Gestão de Inventário</span>
    <h1>Sistema de Gestão de Stock</h1>
    <p>Controlo de inventário com movimentações, alertas e relatórios.</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('inventory',this)">Inventário</button>
    <button class="tab" onclick="setTab('movements',this)">Movimentações</button>
    <button class="tab" onclick="setTab('alerts',this)">Alertas</button>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">+ Novo Produto</button>
    <button class="btn btn-outline" onclick="openMovementModal()">Registar Movimento</button>
  </div>

  <div class="search-bar" style="margin-bottom:20px">
    <input type="text" id="searchInput" placeholder="Pesquisar produto..." oninput="renderCurrentTab()">
  </div>

  <div class="table-wrap" id="tableContainer"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle">Novo Produto</h3>
    <div class="form-group"><label>Nome</label><input type="text" id="fName"></div>
    <div class="form-group"><label>Categoria</label><input type="text" id="fCat" placeholder="ex: Eletrónico, Alimentação"></div>
    <div class="form-group"><label>Quantidade Inicial</label><input type="number" id="fQty" min="0" value="0"></div>
    <div class="form-group"><label>Stock Mínimo</label><input type="number" id="fMin" min="0" value="5"></div>
    <div class="form-group"><label>Preço Unitário (MT)</label><input type="number" id="fPrice" min="0" step="0.01"></div>
    <input type="hidden" id="fId">
    <button class="btn btn-primary" style="width:100%" onclick="saveProduct()">Salvar</button>
  </div>
</div>

<div class="modal-overlay" id="movementModal">
  <div class="modal-box">
    <button class="close" onclick="closeMovementModal()">&times;</button>
    <h3>Registar Movimento</h3>
    <div class="form-group"><label>Tipo</label><select id="mType"><option value="in">Entrada</option><option value="out">Saída</option></select></div>
    <div class="form-group"><label>Produto</label><select id="mProduct"></select></div>
    <div class="form-group"><label>Quantidade</label><input type="number" id="mQty" min="1" value="1"></div>
    <button class="btn btn-primary" style="width:100%" onclick="saveMovement()">Registar</button>
  </div>
</div>

<script src="demo-shared.js"></script>
<script>
let currentTab = 'inventory';

function getProducts() {
  return getData('stockProducts', []);
}
function setProducts(p) {
  setData('stockProducts', p);
}
function getMovements() {
  return getData('stockMovements', []);
}
function setMovements(m) {
  setData('stockMovements', m);
}

function seed() {
  if (getProducts().length) return;
  const data = [
    { id: Date.now()+1, name:'Telemóvel Samsung A14', cat:'Eletrónico', qty:15, min:5, price:8500 },
    { id: Date.now()+2, name:'Fone Bluetooth', cat:'Eletrónico', qty:3, min:10, price:450 },
    { id: Date.now()+3, name:'Carregador USB-C', cat:'Eletrónico', qty:25, min:10, price:180 },
    { id: Date.now()+4, name:'Arroz 5kg', cat:'Alimentação', qty:40, min:10, price:180 },
    { id: Date.now()+5, name:'Óleo 2L', cat:'Alimentação', qty:8, min:10, price:120 },
    { id: Date.now()+6, name:'Farinha de Milho 5kg', cat:'Alimentação', qty:2, min:10, price:150 },
  ];
  setProducts(data);
}

function renderStats() {
  const p = getProducts();
  const totalItems = p.reduce((s,x) => s + x.qty, 0);
  const totalVal = p.reduce((s,x) => s + x.qty * x.price, 0);
  const lowStock = p.filter(x => x.qty <= x.min).length;
  const outOfStock = p.filter(x => x.qty === 0).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${p.length}</div><div class="lbl">Produtos</div></div>
    <div class="stat-card"><div class="num">${totalItems}</div><div class="lbl">Unidades em Stock</div></div>
    <div class="stat-card"><div class="num">${totalVal.toFixed(0)} MT</div><div class="lbl">Valor Total</div></div>
    <div class="stat-card"><div class="num" style="color:${lowStock?'var(--red)':'var(--purple-l)'}">${lowStock}</div><div class="lbl">Stock Baixo</div></div>
  `;
}

function renderInventory() {
  showLoading('tableContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const p = getProducts().filter(x => x.name.toLowerCase().includes(search));
  const el = document.getElementById('tableContainer');
  if (!p.length) {
    el.innerHTML = '<div class="empty-state">Nenhum produto encontrado</div>';
    hideLoading('tableContainer');
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>Produto</th><th>Categoria</th><th>Stock</th><th>Mínimo</th><th>Valor</th><th>Status</th><th></th></tr></thead>
    <tbody>${p.map(x => {
      let tag = '<span class="tag tag-ok">OK</span>';
      if (x.qty === 0) tag = '<span class="tag tag-danger">Sem Stock</span>';
      else if (x.qty <= x.min) tag = '<span class="tag tag-warn">Stock Baixo</span>';
      return `<tr>
        <td><strong>${esc(x.name)}</strong></td>
        <td>${esc(x.cat)}</td>
        <td>${x.qty}</td>
        <td>${x.min}</td>
        <td>${(x.qty * x.price).toFixed(0)} MT</td>
        <td>${tag}</td>
        <td><button class="btn-sm edit" onclick="editProduct(${x.id})" style="margin-right:6px">Editar</button><button class="btn btn-danger" onclick="deleteProduct(${x.id})">Remover</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
  hideLoading('tableContainer');
}

function renderMovements() {
  showLoading('tableContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const m = getMovements().filter(x => x.product.toLowerCase().includes(search)).slice(0,30);
  const el = document.getElementById('tableContainer');
  if (!m.length) {
    el.innerHTML = '<div class="empty-state">Nenhuma movimentação registada</div>';
    hideLoading('tableContainer');
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>Data/Hora</th><th>Tipo</th><th>Produto</th><th>Quantidade</th></tr></thead>
    <tbody>${m.map(x => `
      <tr>
        <td style="font-size:.8rem;color:var(--text2)">${x.date}</td>
        <td><span class="tag ${x.type==='in'?'tag-ok':'tag-danger'}">${x.type==='in'?'Entrada':'Saída'}</span></td>
        <td>${esc(x.product)}</td>
        <td style="font-weight:600;color:${x.type==='in'?'var(--green)':'var(--red)'}">${x.type==='in'?'+':'-'}${x.qty}</td>
      </tr>
    `).join('')}</tbody></table>`;
  hideLoading('tableContainer');
}

function renderAlerts() {
  showLoading('tableContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const p = getProducts().filter(x => (x.qty <= x.min || x.qty === 0) && x.name.toLowerCase().includes(search));
  const el = document.getElementById('tableContainer');
  if (!p.length) {
    el.innerHTML = '<div class="empty-state">Nenhum alerta activo</div>';
    hideLoading('tableContainer');
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>Produto</th><th>Categoria</th><th>Stock Actual</th><th>Mínimo</th><th>Necessário</th><th>Acção</th></tr></thead>
    <tbody>${p.map(x => `
      <tr>
        <td><strong>${esc(x.name)}</strong></td>
        <td>${esc(x.cat)}</td>
        <td style="color:${x.qty===0?'var(--red)':'var(--yellow)'};font-weight:700">${x.qty}</td>
        <td>${x.min}</td>
        <td>${Math.max(0, x.min - x.qty)}</td>
        <td><button class="btn btn-outline" style="padding:5px 14px;font-size:.78rem" onclick="openMovementModalPreset(${x.id})">Repor Stock</button></td>
      </tr>
    `).join('')}</tbody></table>`;
  hideLoading('tableContainer');
}

function renderCurrentTab() {
  if (currentTab === 'inventory') renderInventory();
  else if (currentTab === 'movements') renderMovements();
  else renderAlerts();
  renderStats();
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCurrentTab();
}

function openModal(data) {
  document.getElementById('modal').classList.add('open');
  document.getElementById('fId').value = data ? data.id : '';
  document.getElementById('fName').value = data ? data.name : '';
  document.getElementById('fCat').value = data ? data.cat : '';
  document.getElementById('fQty').value = data ? data.qty : '';
  document.getElementById('fMin').value = data ? data.min : 5;
  document.getElementById('fPrice').value = data ? data.price : '';
  document.getElementById('modalTitle').textContent = data ? 'Editar Produto' : 'Novo Produto';
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function editProduct(id) {
  const p = getProducts().find(x => x.id === id);
  if (p) openModal(p);
}

function saveProduct() {
  clearAllFieldErrors();
  const id = document.getElementById('fId').value;
  const name = document.getElementById('fName').value.trim();
  const qty = parseInt(document.getElementById('fQty').value);
  const price = parseFloat(document.getElementById('fPrice').value);
  let hasErr = false;
  if (!name) { showFieldError('fName', 'Nome é obrigatório'); hasErr = true; }
  if (isNaN(qty) || qty < 0) { showFieldError('fQty', 'Quantidade inválida'); hasErr = true; }
  if (isNaN(price) || price < 0) { showFieldError('fPrice', 'Preço inválido'); hasErr = true; }
  if (hasErr) return;
  const p = getProducts();
  const data = {
    name, cat: document.getElementById('fCat').value.trim() || 'Geral',
    qty: qty || 0,
    min: parseInt(document.getElementById('fMin').value) || 5,
    price: price || 0,
  };
  if (id) {
    const idx = p.findIndex(x => x.id == id);
    if (idx >= 0) p[idx] = { ...p[idx], ...data };
    else p.push({ id: Date.now(), ...data });
  } else {
    p.push({ id: Date.now(), ...data });
  }
  setProducts(p);
  closeModal();
  renderCurrentTab();
  showToast(id ? 'Produto actualizado' : 'Produto adicionado', 'success');
}

async function deleteProduct(id) {
  if (!(await showConfirm('Remover produto?'))) return;
  setProducts(getProducts().filter(x => x.id !== id));
  renderCurrentTab();
  showToast('Produto removido', 'info');
}

function openMovementModal() {
  populateProductSelect();
  document.getElementById('movementModal').classList.add('open');
}
function closeMovementModal() { document.getElementById('movementModal').classList.remove('open'); }

function openMovementModalPreset(productId) {
  const prod = getProducts().find(p => p.id === productId);
  if (!prod) return;
  populateProductSelect(prod.name);
  document.getElementById('mType').value = 'in';
  document.getElementById('movementModal').classList.add('open');
}

function populateProductSelect(selected) {
  const s = document.getElementById('mProduct');
  s.innerHTML = getProducts().map(p => `<option value="${esc(p.name)}"${p.name===selected?' selected':''}>${esc(p.name)}</option>`).join('');
}

function saveMovement() {
  const type = document.getElementById('mType').value;
  const productName = document.getElementById('mProduct').value;
  const qty = parseInt(document.getElementById('mQty').value);
  if (!qty || qty < 1) { showToast('Quantidade inv\u00e1lida', 'warning'); return; }
  const products = getProducts();
  const prod = products.find(p => p.name === productName);
  if (!prod) { showToast('Produto n\u00e3o encontrado', 'warning'); return; }
  if (type === 'out' && prod.qty < qty) { showToast('Stock insuficiente', 'warning'); return; }
  prod.qty += type === 'in' ? qty : -qty;
  setProducts(products);
  const m = getMovements();
  m.unshift({ type, product: productName, qty, date: new Date().toLocaleString() });
  setMovements(m);
  closeMovementModal();
  renderCurrentTab();
  showToast('Movimento registado com sucesso', 'success');
}

seed();
renderCurrentTab();
</script>
</body>
</html>
